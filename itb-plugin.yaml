apiVersion: itb-plugins/v1
name: fhir-validator
version: 0.4.0
description: HL7 FHIR validator (validate, transform, FHIRPath, test data) as GITB REST services
homepage: https://github.com/OpenTestBed/itb-plugin-fhir-validator
license: BSD-3-Clause
maintainers: [jose.a.teixeira@gmail.com]

runtime:
  compose: compose.plugin.yml
  services:
    fhir-validator:
      # Prebuilt image from the WorldHealthOrganization fork of org.hl7.fhir.core,
      # until the ITB changes are merged into the core validator.
      image: ghcr.io/worldhealthorganization/fhir-validator:ci-build
      port: 8080
      healthcheck: /itb/fhir/getModuleDefinition
    gherkin-dialect:
      # Self-describing dialect endpoint (well-known /gherkin-dialect path,
      # CORS-enabled) — sidecar until the main image can serve static files.
      image: nginx:1.27-alpine
      port: 8080
      healthcheck: /gherkin-dialect/component.yml

endpoints:                       # → ITB domain parameters; suites use $DOMAIN{...}
  fhirValidator:   http://fhir-validator:8080/itb/fhir
  fhirTransformer: http://fhir-validator:8080/itb/transform
  fhirPath:        http://fhir-validator:8080/itb/fhirPath
  igManager:       http://fhir-validator:8080/itb/igManager
  matchetype:      http://fhir-validator:8080/itb/matchetype
  testDataGen:     http://fhir-validator:8080/itb/testdata

provides:
  - { capability: fhir-validation,      uri: https://opentestbed.github.io/itb-plugins/capabilities/fhir-validation,      version: 1.0.0, service: fhir-validator, entrypoint: /itb/fhir }
  - { capability: fhir-transform,       uri: https://opentestbed.github.io/itb-plugins/capabilities/fhir-transform,       version: 1.0.0, service: fhir-validator, entrypoint: /itb/transform }
  - { capability: fhirpath-eval,        uri: https://opentestbed.github.io/itb-plugins/capabilities/fhirpath-eval,        version: 1.0.0, service: fhir-validator, entrypoint: /itb/fhirPath }
  # Served, and called by the fhir-terminology dialect's `should match the
  # pattern in` steps, but undeclared until now — so the registry showed
  # fhir-terminology requiring a capability nobody provided. See
  # itb-plugins/capabilities/fhir-matchetype.yaml for what it does not do yet.
  - { capability: fhir-matchetype,      uri: https://opentestbed.github.io/itb-plugins/capabilities/fhir-matchetype,      version: 1.0.0, service: fhir-validator, entrypoint: /itb/matchetype }
  - { capability: test-data-generation, uri: https://opentestbed.github.io/itb-plugins/capabilities/test-data-generation, version: 1.0.0, service: fhir-validator, entrypoint: /itb/testdata }

requires: []

starterSuite: { path: suite/, specification: plugin-smoke }

# Language extension (dialect): parser-format files live in dialect/
# (component.yml + steps.yml [+ scriptlets/]) — THE canonical copy; the
# test-workbench copy under public/components/ is generated by
# itb-cli/src/sync-dialects.mjs.
dialect:
  path: dialect/
  namespace: fhir
  # Served by the deployed plugin at the well-known path (gherkin-dialect
  # sidecar service) — the authoring app loads it from a running deployment.
  endpoint: /gherkin-dialect

config:
  FHIR_VALIDATOR_JAVA_TOOL_OPTIONS: { default: "-Xmx8g", description: "MEOW + transitive deps can push past 4G" }
  FHIR_VALIDATOR_IMAGE: { default: "ghcr.io/worldhealthorganization/fhir-validator:ci-build", description: "Pin to an itb-rest-docker-image-<sha> tag for a reproducible deployment" }
