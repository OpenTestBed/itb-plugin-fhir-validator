# Fragment rules: no host ports (use `itb plugins expose` for debugging),
# no container_name, healthcheck required, env-only config.
#
# The validator is the prebuilt image from the WorldHealthOrganization fork of
# org.hl7.fhir.core (its itb-rest-docker-image workflow), until the ITB changes
# are merged into the core validator; then this points at the image the core
# project publishes. ci-build is the latest build; set FHIR_VALIDATOR_IMAGE to
# an itb-rest-docker-image-<sha> tag to pin.
services:
  fhir-validator:
    image: ${FHIR_VALIDATOR_IMAGE:-ghcr.io/worldhealthorganization/fhir-validator:ci-build}
    restart: unless-stopped
    volumes:
      # Package cache; the image runs as the validator user, HOME=/home/validator.
      - fhir-packages-cache:/home/validator/.fhir
      # Local package registry first (itb-plugin-package-server); unknown
      # packages fall through to the public servers. Path resolves against
      # the compose project dir (itb-starter/).
      - ${FHIR_SETTINGS:-../itb-plugin-fhir-validator/fhir-settings.json}:/home/validator/.fhir/fhir-settings.json:ro
    environment:
      - FHIR_VERSION=4.0
      - JAVA_TOOL_OPTIONS=${FHIR_VALIDATOR_JAVA_TOOL_OPTIONS:--Xmx8g}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/itb/fhir/getModuleDefinition >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # JVM warmup and engine load.
      start_period: 300s

  # Self-describing dialect endpoint: serves dialect/ at the well-known
  # /gherkin-dialect path with CORS, so the authoring app can load the
  # language extension straight from the deployed service (no repo drift).
  # Sidecar because the validator image cannot serve static files.
  gherkin-dialect:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      # Paths resolve against the compose project dir (itb-starter/).
      - ${FHIR_DIALECT:-../itb-plugin-fhir-validator/dialect}:/srv/dialect:ro
      - ${FHIR_DIALECT_CONF:-../itb-plugin-fhir-validator/dialect-server.conf}:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/gherkin-dialect/component.yml"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  fhir-packages-cache:
