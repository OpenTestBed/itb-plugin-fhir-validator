# Fragment rules: no host ports (use `itb plugins expose` for debugging),
# no container_name, healthcheck required, env-only config.
#
# Current distribution mode (mirrors E:\work\itb-starter): the jar is downloaded
# from the wip release into a named cache volume on first boot. A prebuilt
# ghcr.io/opentestbed/fhir-validator image replaces this once plugin CI exists.
services:
  fhir-validator:
    image: eclipse-temurin:17-jre
    restart: unless-stopped
    working_dir: /app
    volumes:
      - fhir-validator-cache:/app
      # Local package registry first (itb-plugin-package-server); unknown
      # packages fall through to the public servers. Path resolves against
      # the compose project dir (itb-starter/).
      - ${FHIR_SETTINGS:-../itb-plugin-fhir-validator/fhir-settings.json}:/root/.fhir/fhir-settings.json:ro
    environment:
      - JAVA_TOOL_OPTIONS=${FHIR_VALIDATOR_JAVA_TOOL_OPTIONS:--Xmx8g}
      - VALIDATOR_URL=${VALIDATOR_URL:-https://github.com/costateixeira/org.hl7.fhir.core/releases/download/wip/validator_cli.jar}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        JAR=/app/validator_cli.jar
        if [ ! -s "$$JAR" ]; then
          echo "Downloading validator jar from $$VALIDATOR_URL"
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
          curl -fSL --retry 3 -o "$$JAR" "$$VALIDATOR_URL"
        fi
        exec java -jar "$$JAR" server 8080 -version 4.0 -allowNetworkAccess
    healthcheck:
      # Java-only TCP healthcheck — works before curl is installed on first boot.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q HTTP"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Cold start = apt + 180MB download + JVM warmup.
      start_period: 300s
volumes:
  fhir-validator-cache:
