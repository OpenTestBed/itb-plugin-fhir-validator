name: ci
on: [push, pull_request]

env:
  # The validator itself is not built here: the fragment pulls
  # ghcr.io/worldhealthorganization/fhir-validator, published by the fork of
  # org.hl7.fhir.core. This repo ships only the dialect sidecar image, named
  # after the compose service so image, container, DNS name and logs read the same.
  DIALECT_IMAGE:   ghcr.io/opentestbed/fhir-validator-dialect

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # The validator is vendored from itb-cli (src/registry-validate.mjs is
      # canonical) so CI needs no access to the private itb-cli repo.
      - name: Install validator dependency
        run: npm install --no-save --no-audit --no-fund js-yaml
      - name: Validate manifest against registry schema
        run: node scripts/registry-validate.mjs .
      # `dev smoke` (boot itb-starter + this fragment, run the starter suite)
      # is deferred until itb-cli grows that command — validating the manifest,
      # compose fragment rules, and dialect (incl. language versioning) is the
      # CI gate for now.

  # The image job builds on every push and PR so a broken Dockerfile fails
  # fast, but publishes only from main/v2 and from version tags. It does not
  # run unless the manifest validates — a published image should never come
  # from a bundle that would be rejected by the registry.
  dialect-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DIALECT_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=edge,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dialect
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # TODO (unchanged from the previous stub): cut a GitHub release on tag with
  # the bundle attached. Image publishing above no longer depends on it.
